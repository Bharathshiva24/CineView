<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>CineView player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><script>
// Plays a YouTube trailer for CineView's bundled demo page. Extension pages send no referrer, and YouTube refuses
// embeds without one (error 153), so the demo loads the player through this page. Messages are passed through both ways.
(function () {
  var q = new URLSearchParams(location.search), id = q.get('v') || '';
  if (!/^[\w-]{11}$/.test(id)) return;
  q.delete('v'); q.set('origin', location.origin); q.set('enablejsapi', '1');
  var YT = 'https://www.youtube-nocookie.com';
  var f = document.createElement('iframe');
  f.src = YT + '/embed/' + id + '?' + q.toString();
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.body.appendChild(f);
  f.addEventListener('load', function () { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'cineview', channel: 'widget' }), YT); });
  window.addEventListener('message', function (e) {
    if (e.source === f.contentWindow) { if (parent !== window) parent.postMessage(e.data, '*'); return; }
    if (e.source === parent) f.contentWindow.postMessage(e.data, YT);
  });
})();
</script></body></html>
